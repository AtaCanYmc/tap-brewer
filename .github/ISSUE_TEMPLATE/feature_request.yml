name: Feature Request
description: Propose a new feature, ecosystem template, or workflow improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues and [ROADMAP.md](../../ROADMAP.md) to ensure this proposal is not already tracked.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the technical friction or limitation this feature resolves.
      placeholder: I encounter an issue when...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Detail the requested behavior, script flags, or template changes.
      placeholder: Add support for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you considered.
  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor Checklist
      options:
        - label: I searched existing issues and PRs before submitting this request.
          required: true
        - label: This proposal adheres to the repository governance and zero-dependency standards.
          required: true
