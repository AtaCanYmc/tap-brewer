name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Shell Script Syntax
        run: |
          for f in $(find scripts -name "*.sh"); do
            bash -n "$f"
          done
      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -v

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Essential Governance Files
        run: |
          for f in README.md SKILL.md LICENSE CONTRIBUTING.md SECURITY.md ROADMAP.md; do
            test -f "$f" || (echo "Missing $f" && exit 1)
          done
      - name: Validate Internal Documentation Links
        run: |
          python3 -c '
          import re, glob, os, sys

          def check_file(f):
              content = open(f, encoding="utf-8").read()
              content = re.sub(r"```[\s\S]*?```", "", content)
              content = re.sub(r"`[^`]*`", "", content)
              links = re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content)
              broken = []
              for link in links:
                  link = link.strip().split("?")[0]
                  if not link or link.startswith("#"):
                      continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link} (resolved: {target})")
              return broken

          all_broken = []
          for f in glob.glob("**/*.md", recursive=True):
              all_broken.extend(check_file(f))

          if all_broken:
              print("Error: Broken internal documentation links detected:", file=sys.stderr)
              for b in all_broken:
                  print("  -", b, file=sys.stderr)
              sys.exit(1)
          print("Internal documentation links verified.")
          '
